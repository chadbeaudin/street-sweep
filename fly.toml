# fly.toml app configuration for StreetSweep
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'streetsweep'
primary_region = 'sjc'

[build]

# The ridden-roads/stats worker runs as a Docker container on Nastromo, not
# on Fly -- see scripts/worker-tick-loop.js.
[processes]
  app = "node server.js"

[http_service]
  internal_port = 3888
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

